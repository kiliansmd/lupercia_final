<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="3" seed="23" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncG type="linear" slope="2.4" intercept="-0.7"/>
      <feFuncB type="linear" slope="2.4" intercept="-0.7"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper)"/>
</svg>
